<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="맹자 읽기 II - 한문 암송/해석 학습용 테스트 페이지">
  <title>맹자읽기 II TEST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* Visually hidden for accessible labels */
    .visually-hidden{position:absolute!important;height:1px;width:1px;overflow:hidden;clip:rect(1px,1px,1px,1px);white-space:nowrap;border:0;padding:0;margin:-1px}

    /* subtle paper texture using an embedded SVG noise layer */
    :root{
      --bg:#f7f5f1; /* soft paper */
      --card:#fffefb;
      --ink:#111415; /* stronger text contrast */
      --accent:#245943; /* slightly deeper, good contrast */
      --muted:#5f665f; /* darker muted for readability */
      --line:#e6e4dc;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;color:var(--ink);font-family:'Noto Sans KR',system-ui,'Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;background-color:var(--bg);background-image:linear-gradient(180deg, rgba(255,255,255,0.55), rgba(0,0,0,0.02)), url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='1' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='table' tableValues='0 0.06'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.06' fill='black'/></svg>");background-repeat:repeat;}

    .shell{max-width:920px;margin:48px auto;padding:36px}

    header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:22px}
    .logo{font-family:'Noto Serif KR','Noto Serif TC',serif;font-size:20px;letter-spacing:1px;color:var(--ink)}
    .logo .sub{color:var(--muted);font-size:12px;margin-left:8px}

    .seal{border:2px solid rgba(36,89,67,0.08);padding:6px 12px;border-radius:999px;background:linear-gradient(180deg, rgba(36,89,67,0.03), transparent);color:var(--accent);font-weight:600;letter-spacing:1px}

    h1{font-family:'Noto Serif KR','Noto Serif TC',serif;font-size:clamp(34px,6vw,56px);line-height:1.02;margin:26px 0 8px;color:var(--ink);text-align:center}
    p.sub{color:var(--muted);line-height:1.7;margin:0 0 30px;font-size:15px}

    .toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
    select,button,textarea{font:inherit}
    select,button{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 14px;color:var(--ink);box-shadow:0 4px 10px rgba(20,20,20,0.03)}
    button{cursor:pointer;transition:box-shadow .12s ease,transform .08s ease}
    button:active{transform:translateY(1px)}
    button.primary{background:var(--accent);color:white;border-color:var(--accent);box-shadow:0 6px 18px rgba(36,89,67,0.12)}

    /* focus styles - visible for keyboard users */
    :focus{outline: none}
    :focus-visible{outline:3px solid rgba(36,89,67,0.16);outline-offset:3px;border-radius:8px}

    .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 18px 40px rgba(34,40,30,0.05);transition:transform .18s ease}
    .panel:hover{transform:translateY(-3px)}

    .top{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}
    .bar{height:10px;background:linear-gradient(90deg,#f1f0ec,#faf9f6);border-radius:10px;overflow:hidden;margin:16px 0 28px}
    .fill{height:100%;background:linear-gradient(90deg,var(--accent),#1f6a54);width:0%;transition:width .45s cubic-bezier(.2,.9,.3,1)}

    .hanmun{font-family:'Noto Serif TC','Noto Serif KR',serif;font-weight:700;letter-spacing:.04em;font-size:clamp(22px,4.7vw,36px);line-height:1.4;padding:24px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.4));box-shadow:inset 0 -6px 18px rgba(24,32,24,0.02);margin-bottom:18px}

    .fieldlabel{display:block;font-size:13px;font-weight:700;margin-bottom:10px}
    textarea{width:100%;min-height:140px;resize:vertical;border:1px solid var(--line);background:#fff;border-radius:10px;padding:16px;line-height:1.8;color:var(--ink);font-size:15px}
    textarea:focus{outline:3px solid rgba(36,89,67,0.12)}

    .actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}
    .actions .group{display:flex;gap:8px}

    .result{display:none;border-radius:10px;padding:18px;margin-top:18px;line-height:1.75;background:#f6f7f5;border:1px solid var(--line)}
    .result.good{background:linear-gradient(180deg,#eaf7ef,#f6fdf8)}
    .result.bad{background:linear-gradient(180deg,#fff6f5,#fffaf9)}
    .result strong{display:block;margin-bottom:8px}
    .result .answer{white-space:pre-wrap}

    .stats{display:flex;gap:18px;color:var(--muted);font-size:13px;margin-top:18px}

    .hidden{display:none!important}
    .finish{text-align:center;padding:36px 0}
    .finish h2{font-size:30px;margin-top:6px}

    .hint{font-size:13px;color:var(--muted);margin-top:20px;line-height:1.7}

    footer.footer{margin-top:55px;padding-top:20px;border-top:1px solid var(--line);text-align:center;font-family:Georgia,serif;font-size:13px;letter-spacing:1.4px;color:var(--muted)}

    @media(max-width:720px){.shell{padding:20px}.toolbar>*{flex:1}.panel{padding:20px}.actions button{flex:1}.hanmun{font-size:20px}}

    /* Respect user preference for reduced motion */
    @media (prefers-reduced-motion: reduce){
      .fill, .panel{transition:none}
    }
  </style>
</head>
<body>
  <a class="visually-hidden" href="#quiz">본문으로 건너뛰기</a>
  <main class="shell">
    <header>
      <div>
        <div class="logo">孟子讀記 <span class="sub">/ II</span></div>
        <div style="font-size:12px;color:var(--muted);margin-top:6px">한문 암송 · 해석 연습</div>
      </div>
      <div class="seal" aria-hidden="true">白紙試驗</div>
    </header>

    <h1>맹자읽기 TEST<span style="color:var(--accent)">.</span></h1>
    <p class="sub">한문을 읽고, 해석을 기억하고, 직접 써보세요.<br>PPT에 적힌 해석과 정확히 일치하는 답안만 정답으로 인정합니다.</p>

    <div class="toolbar">
      <label for="section" class="visually-hidden">범위 선택</label>
      <select id="section" aria-label="시험 범위 선택">
        <option value="전체">전체 범위</option>
        <option>이루상</option>
        <option>이루하</option>
        <option>만장상</option>
        <option>만장하</option>
      </select>

      <label for="count" class="visually-hidden">문제 개수</label>
      <select id="count" aria-label="문제 개수">
        <option value="all">전체 문제</option>
        <option value="5">5문제</option>
        <option value="10">10문제</option>
        <option value="15">15문제</option>
        <option value="20">20문제</option>
        <option value="30">30문제</option>
        <option value="50">50문제</option>
      </select>

      <div style="flex:1"></div>

      <button id="restart" type="button" class="ghost" aria-label="시험 새로 시작">시험 새로 시작</button>
      <button id="retry" type="button" aria-label="오답만 재시험">오답만 재시험</button>
    </div>

    <div class="panel">
      <div id="quiz">
        <div class="top">
          <span id="category" aria-live="polite"></span>
          <span id="progress" aria-live="polite"></span>
        </div>

        <div class="bar" role="progressbar" aria-label="진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="fill" id="fill" style="width:0%"></div>
        </div>

        <div class="hanmun" id="hanmun" aria-label="한문 문장"></div>

        <label class="fieldlabel" for="answer">나의 해석</label>
        <textarea id="answer" placeholder="한글 해석을 정확히 입력하세요." spellcheck="false" aria-label="해석 입력"></textarea>

        <div class="actions">
          <div class="group">
            <button id="skip" type="button" aria-label="건너뛰기">건너뛰기</button>
            <button class="primary" id="check" type="button" aria-label="정답 확인">정답 확인 ↗</button>
          </div>
          <button class="primary hidden" id="next" type="button" aria-label="다음 문장">다음 문장 →</button>
        </div>

        <div class="result" id="result" role="status" aria-live="polite">
          <strong id="resultTitle"></strong>
          <div id="resultBody" class="answer"></div>
        </div>

        <div class="stats" aria-hidden="false">
          <span id="correctCount">정답 0</span>
          <span id="wrongCount">오답 0</span>
          <span id="percent" style="color:var(--muted)">진행 0%</span>
        </div>
      </div>

      <div class="finish hidden" id="finish">
        <div style="font-size:36px">卷</div>
        <h2>시험 완료</h2>
        <p id="summary"></p>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:12px">
          <button class="primary" type="button" id="finishRetry">다시 풀기</button>
          <button type="button" id="finishWrong">오답 재시험</button>
        </div>
      </div>
    </div>

    <div class="hint">※ 띄어쓰기, 문장부호, 맞춤법까지 원문과 일치해야 합니다. 답안 앞뒤의 불필요한 공백만 제거합니다.<br>※ 모든 문제는 매 시험마다 무작위로 출제됩니다.</div>

    <footer class="footer">made by mandeu</footer>
  </main>

  <script>
  const DATA = [{"section": "이루상", "number": "1.1", "hanmun": "孟子曰: 離婁(이루)之明과 公輸子(공수자)之巧로도 不以規矩면 不能成方圓이요", "answer": "맹자..."}]

  let pool = [], idx = 0, wrong = [], correct = 0, answered = false;
  const $ = id => document.getElementById(id);

  function shuffle(a){
    for(let i=a.length-1;i>0;i--){
      let j = Math.floor(Math.random()*(i+1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function normalizeAnswer(s){
    if(typeof s !== 'string') return '';
    let t = s.replace(/\s+/g, '');
    t = t.replace(/[.。｡\"'“”‘’„‚«»「」『』]/g,'');
    return t;
  }

  function start(onlyWrong = false){
    let base;
    if(onlyWrong){
      base = wrong.slice();
    } else {
      base = DATA.filter(x => $('section').value === '전체' || x.section === $('section').value);
    }
    if(base.length === 0){
      alert(onlyWrong ? '재시험할 오답이 없습니다.' : '선택한 범위에 문제가 없습니다.');
      return;
    }
    pool = shuffle(base);
    if($('count').value !== 'all'){
      pool = pool.slice(0, Number($('count').value));
    }
    idx = 0;
    wrong = [];
    correct = 0;
    answered = false;
    $('finish').classList.add('hidden');
    $('quiz').classList.remove('hidden');
    render();
  }

  function setProgress(p){
    const fill = $('fill');
    const bar = fill.parentElement;
    fill.style.width = p + '%';
    bar.setAttribute('aria-valuenow', String(Math.round(p)));
  }

  function render(){
    if(idx >= pool.length){
      $('quiz').classList.add('hidden');
      $('finish').classList.remove('hidden');
      const skipped = pool.length - (correct + wrong.length);
      $('summary').textContent = `${pool.length}문장 중 ${correct}개 정답 · ${wrong.length}개 오답 · ${skipped}개 건너뜀`;
      setProgress(100);
      $('percent').textContent = '진행 100%';
      return;
    }
    const x = pool[idx];
    answered = false;
    $('category').textContent = `${x.section} · ${x.number}`;
    $('progress').textContent = `${idx+1} / ${pool.length}`;
    const percent = Math.round((idx) / Math.max(1,pool.length) * 100);
    setProgress(percent);
    $('percent').textContent = `진행 ${percent}%`;
    $('hanmun').textContent = x.hanmun;
    $('answer').value = '';
    $('answer').disabled = false;
    $('result').style.display = 'none';
    $('result').className = 'result';
    $('check').classList.remove('hidden');
    $('next').classList.add('hidden');
    $('correctCount').textContent = `정답 ${correct}`;
    $('wrongCount').textContent = `오답 ${wrong.length}`;
    $('answer').focus();
  }

  function check(){
    if(answered) return;
    let a = $('answer').value.trim();
    if(!a){
      alert('해석을 입력하세요.');
      return;
    }
    answered = true;
    const normUser = normalizeAnswer(a);
    const normExpected = normalizeAnswer(pool[idx].answer);
    const ok = normUser === normExpected;
    if(ok){
      correct++;
      $('resultTitle').textContent = '✓ 정답입니다';
      $('resultBody').textContent = '입력한 해석이 기준 해석과 일치합니다.';
    } else {
      wrong.push(pool[idx]);
      $('resultTitle').textContent = '✕ 오답입니다';
      $('resultBody').textContent = '정확한 해석\n' + pool[idx].answer;
    }
    $('result').classList.add(ok ? 'good' : 'bad');
    $('result').style.display = 'block';
    $('answer').disabled = true;
    $('check').classList.add('hidden');
    $('next').classList.remove('hidden');
    $('correctCount').textContent = `정답 ${correct}`;
    $('wrongCount').textContent = `오답 ${wrong.length}`;
  }

  function next(){
    idx++;
    render();
  }

  $('check').onclick = check;
  $('next').onclick = next;
  $('skip').onclick = () => { idx++; render(); };
  $('restart').onclick = () => start(false);
  $('retry').onclick = () => start(true);
  $('finishRetry').onclick = () => start(false);
  $('finishWrong').onclick = () => start(true);

  $('answer').addEventListener('keydown', e => {
    if(e.ctrlKey && e.key === 'Enter'){
      e.preventDefault();
      answered ? next() : check();
    }
  });

  // Initialize
  start();
  </script>
</body>
</html>
